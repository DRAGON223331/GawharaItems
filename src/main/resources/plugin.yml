name: GawharaItems
version: '1.2.0'
main: net.gawharasmp.items.GawharaItemsPlugin
api-version: '26.3'
description: Custom survival tools, elemental weapons and nine medieval armor sets for GawharaSMP.
author: Ent2am
commands:
  gitems:
    description: Open the GawharaItems menu or manage custom items.
    usage: /gitems [menu|pack|list|give|bundle|reload]
    aliases: [gitem, gawharaitems]
  gpack:
    description: Re-download the GawharaSMP resource pack.
    usage: /gpack
    aliases: [pack, gawharapack]
permissions:
  gawharaitems.use:
    description: Allows opening the custom items showcase.
    default: true
  gawharaitems.admin:
    description: Allows giving custom items and reloading the plugin.
    default: op
