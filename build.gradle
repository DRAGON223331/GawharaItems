plugins {
    id 'java'
}

group = 'net.gawharasmp'
version = '1.1.1'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
}

dependencies {
    // The server provides the Paper API at runtime; do not shade it into the plugin.
    compileOnly 'io.papermc.paper:paper-api:26.3.build.+'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

processResources {
    filteringCharset = 'UTF-8'
}

jar {
    archiveBaseName = 'GawharaItems'
}
